version: 2
updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      laravel:
        patterns: ['laravel/*']
      dev-tooling:
        dependency-type: development

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns: ['next', 'react', 'react-dom', '@types/react*', 'eslint-config-next']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
