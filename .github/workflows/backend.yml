name: backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docs/api/openapi.json'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/api/openapi.json'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # `.env.example` defaults to PostgreSQL (ADR-0006/0008), so `composer setup` runs `migrate`
    # against a real PostgreSQL 18 — the same major as staging/production (ADR-0011).
    # Tests keep using the in-memory SQLite from phpunit.xml.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: homi
          POSTGRES_USER: homi
          POSTGRES_PASSWORD: homi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homi -d homi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.6'
          tools: composer:v2
          coverage: none

      - name: Setup Node (pinned in .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Setup application
        run: composer setup
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: homi
          DB_USERNAME: homi
          DB_PASSWORD: homi

      # `ci:check` ends with `composer openapi:check`. Scramble types model attributes from the columns of the migrated
      # database on the default connection, so the export needs the same connection as the setup step.
      - name: Lint, static analysis, tests
        run: composer ci:check
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: homi
          DB_USERNAME: homi
          DB_PASSWORD: homi

      # The pgsql group (tests/Pgsql): PostgreSQL-specific SQL and concurrent writes. Its base
      # class refuses any database whose name does not end with `_test`.
      - name: Create the PostgreSQL test database
        run: psql -h 127.0.0.1 -U homi -d homi -c 'CREATE DATABASE homi_test'
        env:
          PGPASSWORD: homi

      - name: Tests on PostgreSQL (pgsql group)
        run: php artisan test --compact --testsuite=Pgsql --fail-on-skipped
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: homi_test
          DB_USERNAME: homi
          DB_PASSWORD: homi

      - name: Package registry is current
        run: php ../scripts/packages/registry --check
