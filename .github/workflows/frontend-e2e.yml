name: frontend-e2e

# End-to-end tests of the frontend (WP-03): Playwright against a production build of `app` on :3001, with the fake
# Telegram of `@homi/testing`. Its guard fails a test that sends a request to an external host. The app signs in
# through the API on stubs, started here on SQLite with PHP's built-in server (WP-21; CI only — developer machines
# use the API behind nginx). A second run takes only the `@radars-off` tests, against a second API with radars switched
# off (WP-30). Every run has two projects (WP-33, `frontend/playwright.config.ts`): cookie mode over every spec and
# header mode over every test that does not name its mode (DEC-101). The manual run (`workflow_dispatch` with `full`,
# no schedule: DEC-100) adds WebKit, desktop, Telegram 6.0, the uz/en render, the dark theme and the throttled `perf`
# project of the performance budget; the first run and the analytics run are each followed by the budget's check
# (WP-33).
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.node-version'
      - '.github/workflows/frontend-e2e.yml'
      # The screen table the coverage step checks (WP-33): an intake that adds a screen runs the check in its own PR.
      - 'docs/migration/data/screens.json'
      # The API these runs boot comes from the PR's tree, and since WP-40 its boot checks, stub mode and access gate
      # decide whether the app works at all, so a change of the backend's code runs the suite too (DEC-108).
      - 'backend/app/**'
      - 'backend/bootstrap/**'
      - 'backend/config/**'
      - 'backend/routes/**'
      - 'backend/database/migrations/**'
      - 'backend/resources/fixtures/**'
      - 'backend/composer.lock'
      # The API steps copy it as their env file.
      - 'backend/.env.example'
  workflow_dispatch:
    inputs:
      full:
        description: 'The manual run before a pass inside Telegram (DEC-100): the projects of other clients, the uz/en render, the dark theme and the throttled performance budget'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node (pinned in .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install pnpm (version pinned in frontend/package.json)
        run: npm install --global pnpm@11.24.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every screen of `docs/migration/data/screens.json` has a test that names it (WP-33): the annotations of
      # `playwright test --list`, no browser or server needed.
      - name: Screens without an end-to-end test
        run: node app/scripts/e2e-coverage.mjs

      # The browser build follows the Playwright version, which only changes with the lockfile.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      # WebKit only for the manual run's `miniapp-ios` project.
      - name: Install the browsers and their system libraries
        env:
          BROWSERS: ${{ inputs.full && 'chromium webkit' || 'chromium' }}
        run: pnpm exec playwright install --with-deps $BROWSERS

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      # The variables override `.env`, which is copied from `.env.example`; the server inherits them.
      - name: Start the API on stubs
        working-directory: backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/backend/database/e2e.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          TELESCOPE_ENABLED: 'false'
          PULSE_ENABLED: 'false'
          SOURCES_ALLOW_STUB: 'true'
          # WP-40: the signed-in methods answer from the stubs (the synthetic launch data of the specs is not signed with
          # a bot token), and the access gate, which runs in stub mode too, admits the stub user. The API refuses to boot
          # with the stubs outside `local` and `testing`, and `composer install` boots it (`package:discover`) before
          # `.env` exists, when `APP_ENV` would default to `production`: the step pins it.
          APP_ENV: local
          SOURCES_NATIVE_STUBS: 'true'
          ACCESS_MODE: open
          # The owner cabinet is on for the default run (WP-81); the second API keeps it unset for `@owner-off`.
          OWNER_CABINET_ENABLED: 'true'
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --no-interaction
          touch database/e2e.sqlite
          php artisan migrate --force --no-interaction
          # Laravel's router script takes the public directory from the working directory, as `artisan serve` does.
          (cd public && nohup php -S 127.0.0.1:8080 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php > "$RUNNER_TEMP/api.log" 2>&1 &)
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/v1/reference > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          E2E_FULL: ${{ inputs.full && '1' || '' }}
          API_URL: http://127.0.0.1:8080/api/v1
          # The stub media base of `backend/.env.example` (`MEDIA_PUBLIC_URL`): the CSP's `img-src` must allow the stub
          # photos, which the specs answer themselves (`stubMedia` of `@homi/testing/playwright`).
          NEXT_PUBLIC_CDN_URL: https://cdn.homi.loc
          NEXT_PUBLIC_APP_ENV: ci
          # The stub `call_url` of `POST /listings/{number}/contact` is on `APP_URL` of `backend/.env.example`; the link
          # allow-list of the app takes the host of this variable (WP-26), so the call page opens in the specs.
          NEXT_PUBLIC_API_URL: https://api.homi.loc/api/v1
          # The map's raster fallback (WP-27): the CSP lets the tile requests out of the page, and the guard of
          # `@homi/testing/playwright` (or a spec's own route) answers them; nothing reaches the tile server.
          CSP_TILE_HOSTS: https://tile.openstreetmap.org

      # The performance budget of WP-33 (`frontend/app/perf-budgets.json`, `frontend/app/scripts/check-budgets.mjs`): what
      # the run above measured — rows 3 to 6 in every run, and in the manual run also the `perf` project's rows 1, 2 and 7
      # to 10 — against the limits. Right after that run, because the next one empties `test-results/`. It prints every
      # value it judged, so a new limit can be read from this step's log.
      - name: Performance budget
        env:
          RUNS: ${{ inputs.full && 'pr,perf' || 'pr' }}
        run: node app/scripts/check-budgets.mjs --runs "$RUNS"

      # Radars switched off (WP-30, DEC-51): `radars_enabled` of `GET /reference` is the API's configuration, not a stub
      # scenario, so a second API on stubs runs with `RADAR_CREATION_ENABLED=false`; the step variable overrides the
      # `true` of `.env`. It answers on another port from the same `.env` and database, and its log goes into the same
      # file. The readiness loop also checks that the switch took.
      - name: Start the API on stubs with radars switched off
        working-directory: backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/backend/database/e2e.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          TELESCOPE_ENABLED: 'false'
          PULSE_ENABLED: 'false'
          SOURCES_ALLOW_STUB: 'true'
          # As in the first API: the stubs boot only in `local`.
          APP_ENV: local
          SOURCES_NATIVE_STUBS: 'true'
          ACCESS_MODE: open
          RADAR_CREATION_ENABLED: 'false'
        run: |
          (cd public && nohup php -S 127.0.0.1:8081 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php >> "$RUNNER_TEMP/api.log" 2>&1 &)
          for attempt in $(seq 1 30); do
            if reference="$(curl -sf http://127.0.0.1:8081/api/v1/reference)"; then
              if grep -q '"radars_enabled":false' <<< "$reference"; then exit 0; fi
              echo "The second API answers with radars switched on: $reference"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

      # Only the tests tagged `@radars-off` (`E2E_RADARS_OFF`, `frontend/playwright.config.ts`). Playwright's web server
      # builds and starts the app again against the second API, so its cached reference data starts empty. It runs after
      # a green first run only: a new run empties `test-results/` and replaces the report.
      - name: End-to-end tests with radars switched off
        run: pnpm test:e2e
        env:
          E2E_RADARS_OFF: '1'
          API_URL: http://127.0.0.1:8081/api/v1
          NEXT_PUBLIC_CDN_URL: https://cdn.homi.loc
          NEXT_PUBLIC_APP_ENV: ci
          NEXT_PUBLIC_API_URL: https://api.homi.loc/api/v1

      # Only the tests tagged `@analytics` (WP-32, `E2E_ANALYTICS`, `frontend/playwright.config.ts`): the web server builds
      # the app again with a fake PostHog key and an unroutable host the specs answer themselves. A step of this job,
      # not a job of its own (developer's choice of 2026-11-21, Actions minutes). It runs after the two green runs.
      - name: End-to-end tests of analytics
        run: pnpm test:e2e
        env:
          E2E_ANALYTICS: '1'
          API_URL: http://127.0.0.1:8080/api/v1
          NEXT_PUBLIC_CDN_URL: https://cdn.homi.loc
          NEXT_PUBLIC_APP_ENV: ci
          NEXT_PUBLIC_API_URL: https://api.homi.loc/api/v1

      # Row 4 of the performance budget with a key: no PostHog code before the first card photo plus 0.5 s (WP-33).
      - name: Performance budget of the analytics build
        run: node app/scripts/check-budgets.mjs --runs analytics

      # The bundle check of WP-33 (DEC-100: a step of this job): a build with `NEXT_PUBLIC_APP_ENV=production` must hold no
      # emulator, test double, gallery, scenario forwarding, server-only key or value, legacy key name, legacy brand or
      # source map (`frontend/app/scripts/check-bundle.mjs`). It replaces the e2e build, so it runs last. The server-only
      # keys get distinctive values, so the check also looks for the values.
      - name: Bundle check of the production build
        working-directory: frontend/app
        env:
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_CDN_URL: https://cdn.homi.loc
          NEXT_PUBLIC_API_URL: https://api.homi.loc/api/v1
          API_URL: https://api.bundle-check.invalid/api/v1
          CSP_TILE_HOSTS: https://tiles.bundle-check.invalid
          CSP_PRIVATE_MEDIA_HOSTS: https://media.bundle-check.invalid
          CSP_ANALYTICS_HOSTS: https://events.bundle-check.invalid
          CSP_FRAME_ANCESTORS: https://frame.bundle-check.invalid
        run: |
          pnpm build
          node scripts/check-bundle.mjs

      - name: Upload traces and report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: |
            frontend/test-results/
            frontend/playwright-report/
            ${{ runner.temp }}/api.log
          retention-days: 7
