name: frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'docs/api/openapi.json'
      - '.node-version'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'docs/api/openapi.json'
      - '.node-version'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node (pinned in .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install pnpm (version pinned in frontend/package.json)
        run: npm install --global pnpm@11.24.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @homi/types is generated from docs/api/openapi.json; a stale or uncommitted file fails here (WP-10).
      - name: Generated API types are current
        run: pnpm types:check

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Unit tests
        run: pnpm test

      # The same packages again in the product time zone: a formatter or clock helper that reads the process
      # time zone fails one of the two runs (15 §3.10).
      - name: Unit tests (Asia/Tashkent)
        run: pnpm --filter @homi/utils --filter @homi/testing test
        env:
          TZ: Asia/Tashkent

      - name: Build
        run: pnpm -r build
