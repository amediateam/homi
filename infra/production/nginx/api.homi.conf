# =============================================================================
#  HOMI · Laravel API (production) — https://api.homi.uz → /var/www/homi.uz/backend/public
#  php8.5-fpm over the host's shared socket (ADR-0011). CORS comes from Laravel (CORS_ALLOWED_ORIGINS).
#  Also serves /up and the dashboards: /horizon and /telescope behind basic auth (below), /pulse gated by Laravel.
#  Source: github.com/amediateam/homi infra/production/nginx/; this copy lives in the server's SVN.
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.homi.uz;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.homi.uz;

    root  /var/www/homi.uz/backend/public;
    index index.php;
    charset utf-8;
    client_max_body_size 50m;

    ssl_certificate     /etc/letsencrypt/live/api.homi.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.homi.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/homi/api.access.log;
    error_log  /var/log/nginx/homi/api.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/plain text/css text/xml application/xml image/svg+xml;

    # Dashboards /telescope and /horizon: HTTP basic auth (docs/infrastructure/deployment.md
    # "Dashboards"). PHP is called straight from this block, so HOMI_DASHBOARD_USER reaches the
    # application only after nginx checked the password. The Laravel gates refuse any request
    # without it (backend app/Http/DashboardAccess.php), such as one sent as /index.php/telescope.
    location ~ ^/(telescope|horizon)(/|$) {
        auth_basic           "HOMI dashboards";
        auth_basic_user_file /etc/homi/dashboards-production.htpasswd;

        fastcgi_pass  unix:/run/php/php8.5-fpm.sock;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME     $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME         /index.php;
        fastcgi_param DOCUMENT_ROOT       $realpath_root;
        fastcgi_param HTTPS               on;
        fastcgi_param HOMI_DASHBOARD_USER $remote_user;
        fastcgi_buffer_size 64k;
        fastcgi_buffers 32 32k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        fastcgi_keep_conn on;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass  unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param HTTPS           on;
        fastcgi_buffer_size 64k;
        fastcgi_buffers 32 32k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        fastcgi_keep_conn on;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # an add_header here drops the server-level ones (nginx inheritance), so repeat them
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~ /\.(?!well-known).* { deny all; }
}
