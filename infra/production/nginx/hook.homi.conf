# =============================================================================
#  HOMI · third-party webhooks (production) — https://hook.homi.uz → the same Laravel app,
#  only the webhook route group is exposed (Telegram Bot API, ADR-0009 §8); everything else 404.
#  Source: github.com/amediateam/homi infra/production/nginx/; this copy lives in the server's SVN.
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name hook.homi.uz;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hook.homi.uz;

    root  /var/www/homi.uz/backend/public;
    index index.php;
    charset utf-8;
    # Telegram updates are small; keep the body cap tight.
    client_max_body_size 1m;

    ssl_certificate     /etc/letsencrypt/live/hook.homi.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hook.homi.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/homi/hook.access.log;
    error_log  /var/log/nginx/homi/hook.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        return 404;
    }
    location = /up {
        try_files $uri /index.php?$query_string;
    }
    location ^~ /telegram/ {
        try_files $uri /index.php?$query_string;
    }

    # PHP runs only through the try_files fallbacks above (`internal`): a direct request for
    # /index.php would otherwise reach Laravel's `/` route on the webhook host.
    location = /index.php {
        internal;
        try_files $uri =404;
        fastcgi_pass  unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param HTTPS           on;
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 30s;
        fastcgi_read_timeout 30s;
        fastcgi_keep_conn on;
    }
    location ~ /\.(?!well-known).* { deny all; }
}
