# HOMI (homi.uz) — external HTTPS checks, evaluated by the Prometheus on the MinIO host 31.220.104.38
# (the "mars" stack). The probes run from there, so they also catch the whole app host going down.
# Alerts carry project="homi"; Alertmanager routes them to the elmarket ops chat (receiver "homi").
# Installed as /etc/prometheus/rules/homi.rules.yml (root:root 0644).
# Source: github.com/amediateam/homi infra/production/monitoring/minio-host/homi.rules.yml
# Runbook: docs/infrastructure/monitoring.md
groups:
  - name: homi-external
    rules:
      - alert: HomiEndpointDown
        expr: probe_success{project="homi", env="production"} == 0
        for: 3m
        labels:
          severity: critical
          service: homi
        annotations:
          summary: "HOMI production: {{ $labels.instance }} does not answer 200"
          description: "The external probe from 31.220.104.38 has failed for 3 minutes (see probe_http_status_code for this instance). Check: homi-deploy production --dry-run on 159.253.19.121; for cdn.homi.uz, nginx and minio on 31.220.104.38."

      - alert: HomiStagingEndpointDown
        expr: probe_success{project="homi", env="staging"} == 0
        for: 10m
        labels:
          severity: warning
          service: homi
        annotations:
          summary: "HOMI staging: {{ $labels.instance }} does not answer 200"
          description: "The external probe has failed for 10 minutes. Check: homi-deploy staging --dry-run on 159.253.19.121; for cdn.staging.homi.uz, nginx and minio on 31.220.104.38."

      - alert: HomiCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{project="homi"} - time() < 14 * 86400
        for: 1h
        labels:
          severity: warning
          service: homi
        annotations:
          summary: "HOMI: the TLS certificate of {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"
          description: "certbot renews 30 days before expiry, so this means renewal has failed. Check: certbot renew --dry-run on 159.253.19.121 (cdn.* certificates live on 31.220.104.38)."

      - alert: HomiCertExpiryCritical
        expr: probe_ssl_earliest_cert_expiry{project="homi"} - time() < 3 * 86400
        for: 10m
        labels:
          severity: critical
          service: homi
        annotations:
          summary: "HOMI: the TLS certificate of {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"
          description: "Renew now: certbot renew --cert-name <host> on 159.253.19.121 (cdn.* on 31.220.104.38)."

      - alert: HomiProbesMissing
        expr: absent(probe_success{project="homi"})
        for: 15m
        labels:
          severity: warning
          project: homi
          service: homi
        annotations:
          summary: "HOMI: no external probe results"
          description: "The homi-blackbox job on 31.220.104.38 returns nothing (blackbox exporter down or job removed). HOMI is not watched from outside until this is fixed."

  # HOMI media buckets on this MinIO have no quotas (developer, 2026-11-13), so a full disk is the limit.
  # The host's own HostDiskSpaceLow/Critical rules exist but route to another chat; these route to HOMI's.
  - name: homi-storage
    rules:
      - alert: HomiMinioDiskLow
        expr: node_filesystem_avail_bytes{job="node", mountpoint="/"} / node_filesystem_size_bytes{job="node", mountpoint="/"} < 0.15
        for: 15m
        labels:
          severity: warning
          project: homi
          service: homi
        annotations:
          summary: "HOMI: the MinIO host disk is {{ $value | humanizePercentage }} free"
          description: "MinIO data (/data/minio) is on / of 31.220.104.38 and the homi-* media buckets have no quotas. Check sizes: mcli du s3hc/homi-public s3hc/homi-private s3hc/homi-tmp (and the homi-staging-* twins)."

      - alert: HomiMinioDiskCritical
        expr: node_filesystem_avail_bytes{job="node", mountpoint="/"} / node_filesystem_size_bytes{job="node", mountpoint="/"} < 0.05
        for: 5m
        labels:
          severity: critical
          project: homi
          service: homi
        annotations:
          summary: "HOMI: the MinIO host disk is {{ $value | humanizePercentage }} free"
          description: "Uploads to every bucket on 31.220.104.38 will fail when the disk is full. Free space or move data now; see docs/infrastructure/cdn.md."
