  # HOMI (homi.uz) — external HTTPS probes through the local blackbox exporter (127.0.0.1:9115).
  # Appended to scrape_configs in /etc/prometheus/prometheus.yml on 31.220.104.38.
  # Source: github.com/amediateam/homi infra/production/monitoring/minio-host/prometheus-homi-blackbox.yml
  - job_name: homi-blackbox
    metrics_path: /probe
    params:
      module: [homi_https]
    scrape_interval: 60s
    scrape_timeout: 15s
    static_configs:
      - targets:
          - https://homi.uz/
          - https://app.homi.uz/
          - https://arm.homi.uz/
          - https://api.homi.uz/up
          - https://hook.homi.uz/up
        labels:
          project: homi
          env: production
      - targets:
          - https://staging.homi.uz/
          - https://app.staging.homi.uz/
          - https://arm.staging.homi.uz/
          - https://api.staging.homi.uz/up
          - https://hook.staging.homi.uz/up
        labels:
          project: homi
          env: staging
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
