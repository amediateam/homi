# Added 2026-08-21: enable the textfile collector so locally-computed metrics
# (currently: upstream-version staleness of the hand-installed monitoring binaries)
# reach Prometheus through the exporter that is already scraped.
# 2026-11-13 (HOMI, github.com/amediateam/homi infra/production/monitoring/app-host/): the systemd
# collector, limited to the HOMI units, for the HomiProductionUnitDown and HomiBackupFailed alerts.
[Service]
ExecStart=
ExecStart=/usr/local/bin/node_exporter \
  --collector.textfile.directory=/var/lib/prometheus/node-exporter \
  --collector.systemd \
  --collector.systemd.unit-include=(horizon-homi|horizon-homi-staging|homi-next-(landing|app|arm)|homi-staging-next-(landing|app|arm)|homi-backup)[.]service \
  --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run)($|/) \
  --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|tmpfs)$
