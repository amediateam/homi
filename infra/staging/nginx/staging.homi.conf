server {
    listen 80;
    listen [::]:80;
    server_name staging.homi.uz;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}
# =============================================================================
#  HOMI · Next.js SSR — landing (staging) — https://staging.homi.uz → next start on 127.0.0.1:3200 (ADR-0013)
#  /_next/static/ is served from the build directory as immutable; everything else is proxied.
#  Process: systemd unit homi-staging-next-landing.service. Source: github.com/amediateam/homi infra/production/nginx/.
# =============================================================================
upstream homi_staging_landing {
    server 127.0.0.1:3200;
    keepalive 32;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.homi.uz;

    ssl_certificate     /etc/letsencrypt/live/staging.homi.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.homi.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/homi/staging-landing.access.log;
    error_log  /var/log/nginx/homi/staging-landing.error.log warn;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/plain text/css text/xml application/xml image/svg+xml;

    location /_next/static/ {
        alias /var/www/staging.homi.uz/frontend/landing/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # an add_header here drops the server-level ones (nginx inheritance), so repeat them
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }

    location / {
        proxy_pass http://homi_staging_landing;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 90s;
        proxy_buffering on;
    }
    location ~ /\.(?!well-known).* { deny all; }
}
