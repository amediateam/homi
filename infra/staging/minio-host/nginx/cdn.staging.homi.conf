# ============================================================
# cdn.staging.homi.uz — HOMI staging public media from the MinIO bucket `homi-staging-public`
# Reviewed source: homi.uz repository, infra/staging/minio-host/nginx/cdn.staging.homi.conf
# On this host: /etc/nginx/sites-available/homi/cdn.staging.homi.conf, symlinked from sites-enabled/.
#
# Pattern: the dedicated-domain edge cache of cdn.proagent.conf, without its SPA fallback.
#   1. The anonymous bucket policy is s3:GetObject only (no ListBucket). MinIO answers a
#      missing key with 403 or 404; both become a plain nginx 404 here, so no MinIO XML
#      (bucket name, request id) reaches the client.
#   2. proxy_cache_key carries $host: the s3_cache zone is shared with the other tenants.
#   3. Keys under originals/ and derived/ are content-addressed (backend config/media.php),
#      so they are cached as immutable for a year.
#   4. Query strings are neither forwarded nor part of the cache key: no cache busting,
#      no S3 sub-resources (?versionId, ?acl, …) through this vhost.
#   5. Uploads never pass this vhost: the application writes through the S3 API
#      (s3.hc.uz) as the IAM user homi-staging-app. The private and tmp buckets are not exposed.
#   6. Staging: every response carries X-Robots-Tag noindex (all *.staging.homi.uz hosts do).
# ============================================================

server {
    server_name cdn.staging.homi.uz;

    # Read-only media delivery; nothing is uploaded through this vhost.
    client_max_body_size 1m;

    access_log /var/log/nginx/homi/cdn.staging.access.log combined buffer=64k flush=1s;
    error_log  /var/log/nginx/homi/cdn.staging.error.log warn;

    # Canonical security headers; repeated in every location because add_header there
    # replaces the inherited set.
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Defense in depth (as in the other tenants' vhosts): never proxy MinIO admin paths.
    location ~ ^/minio/ { return 403; }

    # ── 1. Content-addressed media: immutable ────────────────────────────────
    location ~ ^/(originals|derived)/ {
        limit_except GET { deny all; }
        limit_req zone=static burst=200 nodelay;

        include /etc/nginx/snippets/proxy-buffers-minio.conf;
        proxy_buffering on;           # required for proxy_cache (the snippet turns it off)
        proxy_request_buffering off;
        proxy_read_timeout 60;

        proxy_intercept_errors on;
        error_page 403 404 = @missing;

        proxy_cache s3_cache;
        proxy_cache_key "$scheme$host$uri";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 403 404 1m;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;

        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://127.0.0.1:9000/homi-staging-public$uri;
    }

    # ── 2. Monitoring probe: never cached, so the probe reaches MinIO itself ─
    location = /_probe/ok.txt {
        limit_except GET { deny all; }

        include /etc/nginx/snippets/proxy-buffers-minio.conf;
        proxy_read_timeout 10;

        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        proxy_pass http://127.0.0.1:9000/homi-staging-public/_probe/ok.txt;
    }

    # ── 3. Any other key in the public bucket: public, but not known to be immutable
    location / {
        limit_except GET { deny all; }
        limit_req zone=static burst=100 nodelay;

        include /etc/nginx/snippets/proxy-buffers-minio.conf;
        proxy_buffering on;
        proxy_request_buffering off;
        proxy_read_timeout 60;

        proxy_intercept_errors on;
        error_page 403 404 = @missing;

        proxy_cache s3_cache;
        proxy_cache_key "$scheme$host$uri";
        proxy_cache_valid 200 1h;
        proxy_cache_valid 403 404 1m;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;

        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://127.0.0.1:9000/homi-staging-public$uri;
    }

    # Missing key (MinIO 403/404) → plain 404, briefly cacheable by browsers.
    location @missing {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=60" always;
        return 404;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/cdn.staging.homi.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.staging.homi.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # No OCSP stapling: Let's Encrypt ECDSA certificates carry no OCSP responder URL
    # (same reasoning as s3.hc.conf).
}

# HTTP → HTTPS 301, plus the ACME webroot for issuing and renewing the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name cdn.staging.homi.uz;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
