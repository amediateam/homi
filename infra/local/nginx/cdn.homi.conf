# =============================================================================
#  HOMI · public media (local)
#  https://cdn.homi.loc → <checkout>/backend/storage/app/public served as static files (ADR-0012).
#  No MinIO locally: the Laravel `public` disk writes here and MEDIA_PUBLIC_URL points at this host,
#  so URLs look exactly like production (cdn.homi.uz → MinIO bucket homi-public via s3.hc.uz).
#  Same convention as cdn.app.conf / cdn.qulay.conf on this machine.
# =============================================================================
server {
    listen      80;
    server_name cdn.homi.loc;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    http2       on;
    server_name cdn.homi.loc;

    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/paths.conf;
    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/tls.conf;
    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/security-headers.conf;

    root $approot/backend/storage/app/public;

    access_log /opt/homebrew/var/log/nginx/homi.cdn.access.log;
    error_log  /opt/homebrew/var/log/nginx/homi.cdn.error.log warn;

    client_max_body_size 1m;   # read-only host; uploads go through the API

    # Content-addressed objects (originals/{sha256}.*, derived/{sha256}/{w}.webp) never change.
    location ~ ^/(originals|derived)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /opt/homebrew/etc/nginx/sites-available/homi/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|css|js|pdf|woff2?)$ {
        add_header Cache-Control "public, max-age=300" always;
        include /opt/homebrew/etc/nginx/sites-available/homi/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
