# =============================================================================
#  HOMI · public media CDN (local)
#  https://cdn.homi.loc → MinIO 127.0.0.1:9500, bucket homi-public (anonymous GetObject only)
#  Mirrors the production pattern (s3.hc.conf public-media blocks): long immutable caching
#  for content-addressed keys, MinIO admin/health paths denied, no SPA fallback.
#  The private bucket is never exposed here — presigned URLs go to the S3 API directly.
# =============================================================================
server {
    listen      80;
    server_name cdn.homi.loc;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    http2       on;
    server_name cdn.homi.loc;

    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/paths.conf;
    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/tls.conf;

    access_log $approot/infra/local/logs/cdn.access.log;
    error_log  $approot/infra/local/logs/cdn.error.log warn;

    client_max_body_size 1m;   # read-only host; uploads go to the S3 API, never through the CDN

    location ~ ^/minio/ {
        return 403;
    }

    # Content-addressed objects (originals/{sha256}.*, derived/{sha256}/{w}.webp): immutable.
    location ~ ^/(originals|derived)/ {
        proxy_pass         http://127.0.0.1:9500/homi-public$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host            127.0.0.1:9500;
        proxy_set_header   Connection      "";
        proxy_hide_header  Cache-Control;
        proxy_hide_header  x-amz-request-id;
        proxy_hide_header  x-amz-id-2;
        proxy_hide_header  Server;
        proxy_intercept_errors on;
        error_page 403 =404 /404.txt;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /opt/homebrew/etc/nginx/sites-available/homi/snippets/security-headers.conf;
    }

    # Anything else in the public bucket: short cache (MinIO returns 403 for missing keys → 404).
    location / {
        proxy_pass         http://127.0.0.1:9500/homi-public$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host            127.0.0.1:9500;
        proxy_set_header   Connection      "";
        proxy_hide_header  Cache-Control;
        proxy_hide_header  x-amz-request-id;
        proxy_hide_header  x-amz-id-2;
        proxy_hide_header  Server;
        proxy_intercept_errors on;
        error_page 403 =404 /404.txt;
        add_header Cache-Control "public, max-age=300" always;
        include /opt/homebrew/etc/nginx/sites-available/homi/snippets/security-headers.conf;
    }

    location = /404.txt {
        internal;
        default_type text/plain;
        return 404 "not found\n";
    }
}
