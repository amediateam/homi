# =============================================================================
#  HOMI · third-party webhooks (local)
#  https://hook.homi.loc → same Laravel app, only the webhook route group is exposed
#  (Telegram Bot API; ADR-0009 §8). Everything else answers 404 so the API surface
#  is not reachable through this host. Telegram cannot reach .loc — use a tunnel for tests.
# =============================================================================
server {
    listen      80;
    server_name hook.homi.loc;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    http2       on;
    server_name hook.homi.loc;

    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/paths.conf;
    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/tls.conf;
    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/security-headers.conf;

    root $approot/backend/public;

    # Telegram updates are small; keep the body cap tight (master prompt §8.2).
    client_max_body_size 1m;

    access_log $approot/infra/local/logs/hook.access.log;
    error_log  $approot/infra/local/logs/hook.error.log warn;

    location / {
        return 404;
    }

    location = /up {
        try_files /index.php?$query_string =404;
    }

    location ^~ /telegram/ {
        try_files $uri /index.php?$query_string;
    }

    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/laravel-fpm.conf;
}
