# =============================================================================
#  HOMI · web app / Telegram Mini App (local)
#  https://app.homi.loc → Next.js dev server for frontend/app on 127.0.0.1:3001
# =============================================================================
server {
    listen      80;
    server_name app.homi.loc;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    http2       on;
    server_name app.homi.loc;

    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/paths.conf;
    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/tls.conf;
    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/security-headers.conf;

    access_log /opt/homebrew/var/log/nginx/homi.app.access.log;
    error_log  /opt/homebrew/var/log/nginx/homi.app.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /opt/homebrew/etc/nginx/sites-available/homi/snippets/proxy-next-dev.conf;
    }
}
