# =============================================================================
#  HOMI · Laravel API (local)
#  https://api.homi.loc → <checkout>/backend/public via php-fpm (ADR-0008)
#  Also serves the dashboards (/horizon, /telescope, /pulse), /up and the frozen starter UI.
# =============================================================================
server {
    listen      80;
    server_name api.homi.loc;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    http2       on;
    server_name api.homi.loc;

    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/paths.conf;
    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/tls.conf;
    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/security-headers.conf;

    root $approot/backend/public;

    client_max_body_size 50m;

    access_log /opt/homebrew/var/log/nginx/homi.api.access.log;
    error_log  /opt/homebrew/var/log/nginx/homi.api.error.log warn;

    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary       on;
    gzip_types      application/javascript application/json text/css text/plain text/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/laravel-fpm.conf;
}
