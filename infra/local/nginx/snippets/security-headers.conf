# Baseline response headers for local vhosts. No HSTS locally (mkcert CA, .loc domains).
# Any location that uses its own add_header must include this file again (nginx inheritance rule).
add_header X-Content-Type-Options "nosniff"                        always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
add_header X-Frame-Options        "SAMEORIGIN"                      always;
