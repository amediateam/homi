# =============================================================================
#  HOMI · admin panel (local)
#  https://arm.homi.loc → Next.js dev server for frontend/arm on 127.0.0.1:3002
# =============================================================================
server {
    listen      80;
    server_name arm.homi.loc;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    http2       on;
    server_name arm.homi.loc;

    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/paths.conf;
    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/tls.conf;
    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/security-headers.conf;

    access_log $approot/infra/local/logs/arm.access.log;
    error_log  $approot/infra/local/logs/arm.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:3002;
        include /opt/homebrew/etc/nginx/sites-available/homi/snippets/proxy-next-dev.conf;
    }
}
