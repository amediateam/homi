# =============================================================================
#  HOMI · landing (local)
#  https://homi.loc → Next.js dev server for frontend/landing on 127.0.0.1:3000
# =============================================================================
server {
    listen      80;
    server_name homi.loc;
    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    http2       on;
    server_name homi.loc;

    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/paths.conf;
    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/tls.conf;
    include /opt/homebrew/etc/nginx/sites-available/homi/snippets/security-headers.conf;

    access_log /opt/homebrew/var/log/nginx/homi.landing.access.log;
    error_log  /opt/homebrew/var/log/nginx/homi.landing.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /opt/homebrew/etc/nginx/sites-available/homi/snippets/proxy-next-dev.conf;
    }
}
